#:schema https://mago.carthage.software/1.59.0/schema.json
version = "1.59.0"
php-version = "8.4"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = ["var/**", "public/assets/**", "assets/vendor/**"]

[source.glob]
literal-separator = true

[linter]
integrations = ["symfony"]

[linter.rules]
# Domain entities are plain data carriers: their constructors legitimately
# take every column they own, so the parameter-count heuristic does not
# apply to them.
excessive-parameter-list = { exclude = ["src/Domain/Entity/**"] }

[formatter]
preset = "psr-12"
